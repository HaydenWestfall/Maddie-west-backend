spring:
  application:
    name: maddie-west-events-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/rental-service}
  mail:
    host: ${SMTP_HOST:mail.smtp2go.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://192.168.68.80:5173}
  mail:
    from: ${MAIL_FROM:${SMTP_USER:no-reply@maddiewestevents.com}}
    coordinator-email: ${COORDINATOR_NOTIFICATION_EMAIL}
  payment:
    venmo-username: ${VENMO_USERNAME:MaddieWestEvents}
  admin:
    base-url: ${ADMIN_UI_BASE_URL:http://localhost:4200}
  coordinator-seed:
    email: ${COORDINATOR_SEED_EMAIL:}
    name: ${COORDINATOR_SEED_NAME:}
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:maddie-west-rentals-dev}
    public-base-url: ${R2_PUBLIC_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        # Health only — nothing else should be reachable on an unauthenticated path
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # The SMTP relay being unreachable degrades email, but the API is still serving
    # requests — letting it mark the container unhealthy would cause pointless restarts.
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
