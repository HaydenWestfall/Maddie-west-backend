<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Your rental has been cancelled</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333333; line-height: 1.5;">
    <h2 style="color: #b3261e;">Your rental has been cancelled</h2>

    <p th:text="${'Hi ' + request.requester.name + ','}"></p>

    <p>
        Your rental for
        <span th:text="${request.dateRange.startDate}"></span> &ndash; <span th:text="${request.dateRange.endDate}"></span>
        has been <strong>cancelled</strong>.
    </p>

    <p th:if="${reason != null and !#strings.isEmpty(reason)}">
        <strong>Reason:</strong> <span th:text="${reason}"></span>
    </p>

    <h3>Cancelled items</h3>
    <table style="border-collapse: collapse; width: 100%; max-width: 480px;">
        <thead>
            <tr style="background-color: #f5efe9;">
                <th style="text-align: left; padding: 6px 10px; border: 1px solid #e0d8d0;">Item</th>
                <th style="text-align: right; padding: 6px 10px; border: 1px solid #e0d8d0;">Qty</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${request.items}">
                <td style="padding: 6px 10px; border: 1px solid #e0d8d0;" th:text="${item.itemName}"></td>
                <td style="text-align: right; padding: 6px 10px; border: 1px solid #e0d8d0;" th:text="${item.quantity}"></td>
            </tr>
        </tbody>
    </table>

    <p>Request ID: <span th:text="${request.id}"></span></p>

    <p>
        If you believe this was a mistake, or if you have any questions about a refund,
        just reply to this email and we'll be glad to help.
    </p>
</body>
</html>
