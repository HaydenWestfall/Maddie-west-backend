<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>New contact form submission</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333333; line-height: 1.5;">
    <h2 style="color: #5b3a29;">New contact form submission</h2>

    <p>A message was submitted through the website contact form.</p>

    <table style="border-collapse: collapse;">
        <tr><td style="padding: 2px 8px 2px 0;"><strong>Name:</strong></td><td th:text="${contact.name}"></td></tr>
        <tr><td style="padding: 2px 8px 2px 0;"><strong>Email:</strong></td><td th:text="${contact.email}"></td></tr>
        <tr th:if="${contact.phone != null and !#strings.isEmpty(contact.phone)}">
            <td style="padding: 2px 8px 2px 0;"><strong>Phone:</strong></td><td th:text="${contact.phone}"></td>
        </tr>
        <tr th:each="field : ${contact.additionalFields}">
            <td style="padding: 2px 8px 2px 0;"><strong th:text="${field.key} + ':'"></strong></td>
            <td th:text="${field.value}"></td>
        </tr>
    </table>

    <div th:if="${contact.message != null and !#strings.isEmpty(contact.message)}">
        <h3>Message</h3>
        <p style="white-space: pre-wrap;" th:text="${contact.message}"></p>
    </div>

    <hr style="border: none; border-top: 1px solid #e0d8d0; margin: 24px 0;"/>
    <p style="color: #888888; font-size: 12px;">Sent via the Maddie West Events website contact form.</p>
</body>
</html>
