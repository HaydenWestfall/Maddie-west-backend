<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Update on your rental request</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #333333; line-height: 1.5">
    <h2 style="color: #b3261e">Update on your rental request</h2>

    <p th:text="${'Hi ' + request.requester.name + ','}"></p>

    <p>
      Unfortunately, we're unable to fulfill your rental request for
      <b><span th:text="${request.dateRange.startDate}"></span></b> &ndash;
      <b><span th:text="${request.dateRange.endDate}"></span></b>.
    </p>

    <p th:if="${reason != null and !#strings.isEmpty(reason)}">
      <strong>Reason:</strong> <span th:text="${reason}"></span>
    </p>

    <h3>Requested items</h3>
    <table style="border-collapse: collapse; width: 100%; max-width: 480px">
      <thead>
        <tr style="background-color: #ececec">
          <th style="text-align: left; padding: 6px 10px; border: 1px solid #d2d2d2">Item</th>
          <th style="text-align: right; padding: 6px 10px; border: 1px solid #d2d2d2">Qty</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${request.items}">
          <td style="padding: 6px 10px; border: 1px solid #d2d2d2" th:text="${item.itemName}"></td>
          <td style="text-align: right; padding: 6px 10px; border: 1px solid #d2d2d2" th:text="${item.quantity}"></td>
        </tr>
      </tbody>
    </table>

    <p><b>Request ID:</b> <span th:text="${request.id}"></span></p>

    <p>
      If you have questions or would like to discuss alternatives, please reach out to Madison Westfall directly at
      <b>madisonwestfall@maddiewestevents.com</b>.
    </p>
  </body>
</html>
