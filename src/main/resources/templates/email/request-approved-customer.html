<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Rental request approved</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333333; line-height: 1.5;">
    <h2 style="color: #2e7d32;">Your rental request has been approved!</h2>

    <p th:text="${'Hi ' + request.requester.name + ','}"></p>

    <p>Great news &mdash; your rental request has been <strong>approved</strong>. Here's a summary:</p>

    <h3>Rental dates</h3>
    <p>
        <span th:text="${request.dateRange.startDate}"></span>
        &ndash;
        <span th:text="${request.dateRange.endDate}"></span>
    </p>

    <h3>Reserved items</h3>
    <table style="border-collapse: collapse; width: 100%; max-width: 480px;">
        <thead>
            <tr style="background-color: #f5efe9;">
                <th style="text-align: left; padding: 6px 10px; border: 1px solid #e0d8d0;">Item</th>
                <th style="text-align: right; padding: 6px 10px; border: 1px solid #e0d8d0;">Qty</th>
                <th style="text-align: right; padding: 6px 10px; border: 1px solid #e0d8d0;">Price</th>
                <th style="text-align: right; padding: 6px 10px; border: 1px solid #e0d8d0;">Subtotal</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${request.items}">
                <td style="padding: 6px 10px; border: 1px solid #e0d8d0;" th:text="${item.itemName}"></td>
                <td style="text-align: right; padding: 6px 10px; border: 1px solid #e0d8d0;" th:text="${item.quantity}"></td>
                <td style="text-align: right; padding: 6px 10px; border: 1px solid #e0d8d0;" th:text="${'$' + item.pricePerItem}"></td>
                <td style="text-align: right; padding: 6px 10px; border: 1px solid #e0d8d0;" th:text="${'$' + item.subtotal}"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3" style="text-align: right; padding: 6px 10px; font-weight: bold;">Total</td>
                <td style="text-align: right; padding: 6px 10px; font-weight: bold;" th:text="${'$' + request.totalPrice}"></td>
            </tr>
        </tfoot>
    </table>

    <p>Request ID: <span th:text="${request.id}"></span></p>

    <p>We look forward to making your event special!</p>
</body>
</html>
